[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibee-cli"
version = "0.1.0"
description = "Official command-line interface for the IBEE Solutions cloud platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "IBEE Solutions", email = "support@ibee.ai"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "ibee>=0.1.1",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build"]

[project.scripts]
ibee = "ibee_cli.main:app"

[project.urls]
Homepage = "https://ibee.ai"
Documentation = "https://ibee.ai/docs/api-reference"
Repository = "https://github.com/devs-ibee/ibee-cli"

[tool.setuptools.packages.find]
where = ["src"]
