name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # A CLI branch is tested with the ibee-python branch of the same name when one
      # exists (for example feat/0.5.0 with feat/0.5.0); otherwise with ibee from PyPI.
      - name: Install the IBEE Python SDK from the same-named branch
        env:
          SDK_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/devs-ibee/ibee-python.git "$SDK_REF" > /dev/null; then
            pip install "ibee @ git+https://github.com/devs-ibee/ibee-python.git@${SDK_REF}"
          else
            echo "No ibee-python branch named $SDK_REF; using ibee from PyPI."
          fi

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      # One command per operation of contract/ibee-cloud.yaml, generated by
      # scripts/generate_commands.py: the committed commands must match the contract.
      - name: Commands match the contract
        run: python scripts/generate_commands.py --check

      - name: Run tests
        run: pytest -q

      - name: CLI smoke
        run: |
          ibee --version
          ibee --help

      - name: Build distributions
        run: python -m build
