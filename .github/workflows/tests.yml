name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install IBEE Python SDK 0.3 candidate
        if: endsWith(github.head_ref, 'public-api-v0.3') || endsWith(github.ref_name, 'public-api-v0.3')
        env:
          SDK_REF: ${{ github.head_ref || github.ref_name }}
        run: pip install "ibee @ git+https://github.com/devs-ibee/ibee-python.git@${SDK_REF}"

      - name: Install IBEE Python SDK 0.4 candidate
        if: endsWith(github.head_ref, 'portal-parity-0.4') || endsWith(github.ref_name, 'portal-parity-0.4')
        env:
          SDK_REF: ${{ github.head_ref || github.ref_name }}
        run: pip install "ibee @ git+https://github.com/devs-ibee/ibee-python.git@${SDK_REF}"

      - name: Install upstream-admission SDK candidate for the paired PR
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/upstream-vm-admission'
        run: pip install "ibee @ git+https://github.com/devs-ibee/ibee-python.git@9dbe2673a052d63c2c38183f0a3d51b2d1e3b7bb"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: CLI smoke
        run: |
          ibee --version
          ibee --help

      - name: Build distributions
        run: python -m build
